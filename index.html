<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Contas</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#9b87d6"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f8f5fc;--card:#fff;--tx:#3b3652;--mu:#8e89a8;--ac:#9b87d6;--act:#fff;--bd:#eee9f6;--bad:#e07a8f;--warn:#d9a05b;--ok:#5fb99a;--c1:#d9f2e6;--c2:#d6e8fa;--c3:#ffe3d3;--c4:#e4dcf8;--c5:#fcdce8;--c6:#eceaf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1926;--card:#252336;--tx:#ece8fa;--mu:#9d98b8;--ac:#a995e6;--bd:#33304a;--c1:#27403a;--c2:#27374c;--c3:#4a362f;--c4:#383157;--c5:#4a2f3d;--c6:#302e3f}}
:root[data-theme="dark"]{--bg:#1b1926;--card:#252336;--tx:#ece8fa;--mu:#9d98b8;--ac:#a995e6;--bd:#33304a;--c1:#27403a;--c2:#27374c;--c3:#4a362f;--c4:#383157;--c5:#4a2f3d;--c6:#302e3f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px 14px 90px;max-width:640px}
h1{font-size:19px;margin:0}h2{font-size:14px;margin:18px 2px 8px;color:var(--mu);font-weight:600}
.card{background:var(--card);border-radius:18px;padding:12px 14px;margin:8px 0;box-shadow:0 2px 10px rgba(120,100,170,.07)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:8px 10px}
button{cursor:pointer}
.tabs{display:flex;gap:6px;margin:12px 0;background:var(--c4);padding:4px;border-radius:16px}.tabs button{flex:1;border:0;background:none;padding:8px 2px;border-radius:12px;color:var(--mu);font-weight:600}.tabs button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 6px rgba(120,100,170,.15)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row .n{flex:1;min-width:0}.row small{color:var(--mu);display:block}.v{font-weight:600;white-space:nowrap}
.ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none}
.done .n,.done .v{opacity:.45;text-decoration:line-through}
.big{font-size:28px;font-weight:700}.mu{color:var(--mu)}.bad{color:var(--bad)}.warn{color:var(--warn)}.ok{color:var(--ok)}
.hero{background:linear-gradient(135deg,var(--c4),var(--c2))}
.bar{height:9px;border-radius:6px;background:rgba(150,140,190,.2);overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g3 div{border-radius:14px;padding:9px;font-size:13px}.g3 b{display:block;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.chip{border-radius:20px;padding:6px 12px;background:var(--c6);border:0;font-size:14px}.chip.on{background:var(--ac);color:#fff}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:30px;box-shadow:0 6px 18px rgba(120,100,170,.4);z-index:5}
.ov{position:fixed;inset:0;background:rgba(40,30,70,.4);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sh input,.sh select{width:100%;margin-bottom:8px}.lab{font-size:13px;color:var(--mu);margin:4px 2px}
.btn{background:var(--ac);color:#fff;border:0;width:100%;padding:13px;font-weight:700;font-size:16px;border-radius:14px}.btn2{background:var(--c6);border:0;width:100%;margin-top:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cd{aspect-ratio:1;border-radius:12px;border:0;background:var(--c6);padding:2px;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center}.cd.sel{outline:2px solid var(--ac)}.cd.td{background:var(--c4)}.cd small{font-size:9px;line-height:1}.dots{display:flex;flex-wrap:wrap;justify-content:center;min-height:8px}.dt{width:6px;height:6px;border-radius:50%;display:inline-block;margin:1px}.dw{background:var(--warn)}.db{background:var(--bad)}.dk{background:var(--ok)}.dp{background:var(--ac)}.de{background:#7fb7e8}
.x{background:none;border:0;padding:2px 4px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid2 input{width:100%}.recv{background:var(--c5);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:12px;border-bottom:0}.recv .v{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 3px;border-bottom:1px solid var(--bd);text-align:left}.wrap{overflow-x:auto}
</style></head><body>
<div class="top"><h1>💜 Minhas Contas</h1><div><button onclick="mv(-1)">‹</button> <b id="mes"></b> <button onclick="mv(1)">›</button></div></div>
<div class="tabs" id="tabs"></div>
<div id="app"></div>
<button class="fab" onclick="openS()" aria-label="Nova compra">+</button>
<div id="ov" class="ov" style="display:none" onclick="if(event.target==this)closeS()"><div class="sh" id="sh"></div></div>
<script src="app1.js"></script>
<script src="app2.js"></script>
<script src="app3.js"></script>
</body></html>
